# HYDRA-UMC-WATCH - settings of the watch app. Read when the app starts; a missing or invalid line keeps the value shown here.
# Everything that touches safety is OFF here and has to be switched on on purpose.

# Alerts the paired phone forwards to the wrist: a vibration by severity and, for a critical one, a notification that stays.
alerts.enabled = true
# An alert that is older than this when it is shown is marked as outdated (seconds, 10 to 3600).
alerts.stale_after_s = 300
# Keep a critical alert as a notification that stays until the operator opens it.
alerts.critical_persistent = true

# Presence of the operator (dead-man): the watch sends a heartbeat while the operator is in the cell. OFF by default.
# What a lost heartbeat does is decided by the server, never by the watch.
presence.enabled = false
# Seconds between two heartbeats (1 to 60).
presence.interval_s = 5

# Two-step confirmation of a spoken order from the wrist. OFF by default.
confirm.enabled = false
# The second tap has to come within this time of the first (seconds, 2 to 30).
confirm.second_tap_window_s = 6
# A second tap sooner than this after the first is ignored, so one hurried touch is not two (milliseconds, 200 to 2000).
confirm.min_gap_ms = 500
# The longest a confirmation stays valid on the watch, whatever the sender says (seconds, 5 to 120).
confirm.max_validity_s = 30

# Watch-face complication with the robots running or the alarm.
complication.enabled = true
# The complication shows "?" instead of a number once the last state is older than this (seconds, 30 to 3600).
complication.stale_after_s = 300

# Tile with the last state (same wording as the complication, "?" once older than complication.stale_after_s).
tile.enabled = true
