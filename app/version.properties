# =============================================================================
# HYDRA-UMC-WATCH - build version state
# =============================================================================
# Bumped only by build.bat/build.sh through the coordinated version utilities.
# app/build.gradle.kts always reads this file and never writes it, so a direct
# Gradle command cannot desynchronise this native version from the manifest.
#
# Odometer rule (ecosystem-wide convention, base 10, same as
# HYDRA-UMC-STUDIO/scripts/bump-version.mjs and sibling repo
# HYDRA-UMC-ANDROID-CONTROL/app/version.properties): patch +1 on every
# incremental build; if patch would go above 9 it resets to 0 and minor +1.
# Example: 0.0.9 -> 0.1.0.
#
# versionCode is a separate, simple monotonic counter (+1 always, no carry) -
# Android requires versionCode to strictly increase across all builds that
# ever ship, so it cannot follow the same reset-at-9 rule as versionName.
versionMajor=0
versionMinor=1
versionPatch=5
versionCode=15
