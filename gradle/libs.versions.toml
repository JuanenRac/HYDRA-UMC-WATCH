[versions]
agp = "9.3.1"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.10.1"
composeBom = "2024.09.00"
# Wear Compose is versioned independently from the phone Compose BOM above -
# 1.6.2 is the latest stable release (1.7.0 is still in alpha/beta as of
# this writing, see gradle/libs.versions.toml's own comment convention).
wearCompose = "1.6.2"
wear = "1.4.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Real JSON codec for the SERVER<->WATCH sync protocol (protocol/SyncMessage.kt) -
# matches the Kotlin version above, no separate pin to track.
kotlinxSerializationJson = "1.7.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Wear OS-specific UI toolkit - NOT androidx.compose.material3 (that's the
# handheld/tablet variant). compose-material here brings Wear's own
# MaterialTheme/Text/Scaffold tuned for round/square small screens;
# compose-foundation brings CurvedLayout and other Wear-only primitives.
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
